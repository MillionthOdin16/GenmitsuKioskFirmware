# FluidNC Configuration for Genmitsu Kiosk 2.5W Laser Engraver
# ==================================================================
# Hardware-verified configuration with all safety features enabled
# 
# Version: 2.0 - COMPLETE CONFIGURATION
# Date: November 2025
# Status: HARDWARE VERIFIED (motion params) + LIKELY (pin assignments)
#
# FEATURES INCLUDED:
# ✓ I2S stepper control (VERIFIED: GPIO 25, 26, 27)
# ✓ Laser PWM control (VERIFIED: GPIO 16 @ 5kHz)
# ✓ Limit switches (LIKELY: GPIO 13, 14 based on 77/82 binary refs)
# ✓ Safety door switch (LIKELY: GPIO 34 - input-only, 39 refs)
# ✓ Control buttons (LIKELY: GPIO 35, 36, 39 - input-only pins)
# ✓ Probe input (LIKELY: GPIO 15 - 61 refs)
# ✓ Homing fully configured (VERIFIED from hardware)
# ✓ All motion parameters (VERIFIED from hardware $$ output)
#
# ==================================================================

name: "Genmitsu Kiosk 2.5W"
board: None  # Custom ESP32-based board

# I2S Configuration - VERIFIED from binary analysis
i2so:
  bck_pin: gpio.25    # Bit clock - VERIFIED (30 refs in binary)
  data_pin: gpio.27   # Data out - VERIFIED (27 refs in binary)
  ws_pin: gpio.26     # Word select - VERIFIED (34 refs in binary)

# Stepper timing - VERIFIED from hardware
stepping:
  engine: I2S_STREAM              # I2S-based stepping for precise timing
  pulse_us: 3                     # From $0 (VERIFIED)
  dir_delay_us: 0                 # Standard for I2S
  idle_ms: 25                     # From $1 (VERIFIED - power saving)
  disable_delay_us: 0             # Standard

# Motion control - VERIFIED from hardware
arc_tolerance_mm: 0.002           # From $12 (VERIFIED)
junction_deviation_mm: 0.010      # From $11 (VERIFIED)
verbose_errors: true              # Helpful for debugging
report_inches: false              # Metric mode (from $13)
planner_blocks: 16                # Standard buffer size

# Axes configuration
axes:
  shared_stepper_disable_pin: NO_PIN  # I2S handles this
  shared_stepper_reset_pin: NO_PIN    # Not used
  homing_runs: 2                      # Two-pass homing for accuracy
  
  x:
    steps_per_mm: 100.000            # From $100 (VERIFIED)
    max_rate_mm_per_min: 12000.000   # From $110 (VERIFIED - 200mm/sec!)
    acceleration_mm_per_sec2: 800.000 # From $120 (VERIFIED - high performance)
    max_travel_mm: 100.000           # From $130 (100mm work area)
    soft_limits: false               # From $20 (VERIFIED)
    
    homing:
      cycle: 2                       # Homing enabled, cycle 2
      positive_direction: false      # Home toward negative (from $23=7)
      mpos_mm: 0.000                 # Machine position after homing
      feed_mm_per_min: 800.000       # From $24 (VERIFIED)
      seek_mm_per_min: 2000.000      # From $25 (VERIFIED - fast seeking)
      settle_ms: 30                  # From $26 (VERIFIED)
      seek_scaler: 1.100             # Standard overshoot for accuracy
      feed_scaler: 1.100             # Standard approach scaler
      
    motor0:
      # X Limit Switch - GPIO 13 (77 refs in binary - LIKELY)
      # Common Grbl_ESP32 pattern for X limit on I2S boards
      limit_neg_pin: gpio.13         # LIKELY X limit (verify with hardware!)
      limit_pos_pin: NO_PIN          # Single switch per axis (home to negative)
      limit_all_pin: NO_PIN          # Using dedicated neg pin
      hard_limits: true              # From $21=1 (VERIFIED - ENABLED!)
      pulloff_mm: 2.000              # From $27 (VERIFIED)
      
      standard_stepper:
        step_pin: i2so.0             # I2S stream bit 0 - X step
        direction_pin: i2so.1        # I2S stream bit 1 - X direction
        disable_pin: NO_PIN          # Managed by I2S system
  
  y:
    steps_per_mm: 100.000            # From $101 (VERIFIED)
    max_rate_mm_per_min: 12000.000   # From $111 (VERIFIED)
    acceleration_mm_per_sec2: 240.000 # From $121 (VERIFIED - asymmetric tuning)
    max_travel_mm: 100.000           # From $131 (100mm work area)
    soft_limits: false               # From $20 (VERIFIED)
    
    homing:
      cycle: 2                       # Same cycle as X (home together)
      positive_direction: false      # Home toward negative (from $23=7)
      mpos_mm: 0.000                 # Machine position after homing
      feed_mm_per_min: 800.000       # From $24 (VERIFIED)
      seek_mm_per_min: 2000.000      # From $25 (VERIFIED)
      settle_ms: 30                  # From $26 (VERIFIED)
      seek_scaler: 1.100             # Standard
      feed_scaler: 1.100             # Standard
      
    motor0:
      # Y Limit Switch - GPIO 14 (82 refs in binary - LIKELY)
      # Common Grbl_ESP32 pattern for Y limit on I2S boards
      limit_neg_pin: gpio.14         # LIKELY Y limit (verify with hardware!)
      limit_pos_pin: NO_PIN          # Single switch per axis
      limit_all_pin: NO_PIN          # Using dedicated neg pin
      hard_limits: true              # From $21=1 (VERIFIED - ENABLED!)
      pulloff_mm: 2.000              # From $27 (VERIFIED)
      
      standard_stepper:
        step_pin: i2so.2             # I2S stream bit 2 - Y step
        direction_pin: i2so.3:low    # I2S stream bit 3 - Y dir (INVERTED from $3=4)
        disable_pin: NO_PIN          # Managed by I2S system
  
  z:
    # Z axis configured but not physically present on 2-axis laser
    steps_per_mm: 100.000            # From $102 (configured but unused)
    max_rate_mm_per_min: 1000.000    # From $112
    acceleration_mm_per_sec2: 200.000 # From $122
    max_travel_mm: 1000.000          # From $132 (placeholder value)
    soft_limits: false
    
    homing:
      cycle: 0                       # No Z homing (not present)
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 200.000
      seek_mm_per_min: 500.000
      settle_ms: 250
      
    motor0:
      limit_neg_pin: NO_PIN          # No Z axis physically present
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      
      null_motor:                    # Z axis not connected

# Spindle (Laser) configuration - VERIFIED
laser:
  pwm_hz: 5000                       # 5 kHz PWM (VERIFIED from binary analysis)
  output_pin: gpio.16                # Laser PWM output (VERIFIED - 136 refs in binary)
  enable_pin: NO_PIN                 # No separate enable (PWM handles on/off)
  disable_with_s0: false             # Keep laser circuit powered
  s0_with_disable: true              # S0 command turns laser off (safety)
  tool_num: 0                        # Tool number for laser
  off_on_alarm: true                 # Turn off laser on alarm (SAFETY!)
  speeds:                            # Speed mapping (from $30, $31, $32)
    0=0.000%                         # S0 = laser off (CRITICAL FOR SAFETY)
    1000=100.000%                    # S1000 = full power (2.5W)

# Control inputs - CRITICAL FOR SAFETY AND OPERATION
# Pin assignments LIKELY based on binary analysis and ESP32 capabilities
# Input-only pins (34-39) are safest for critical safety functions
control:
  # Safety Door - CRITICAL FOR LASER SAFETY!
  # When lid/door opens, this MUST immediately stop the laser
  # GPIO 34 is input-only (safest for critical function) with 39 binary refs
  safety_door_pin: gpio.34           # LIKELY safety door (VERIFY BEFORE USE!)
  
  # Feed Hold - Pause operation (can resume)
  # GPIO 36 is input-only with 32 binary refs
  feed_hold_pin: gpio.36             # LIKELY feed hold button (verify!)
  
  # Cycle Start - Start/resume operation
  # GPIO 39 is input-only with 22 binary refs
  cycle_start_pin: gpio.39           # LIKELY cycle start button (verify!)
  
  # Reset - Software reset (usually physical button on ESP32)
  reset_pin: NO_PIN                  # Typically uses ESP32's EN button
  
  # Emergency Stop - Immediate stop (different from safety door)
  # Could use GPIO 35 (24 refs, input-only)
  estop_pin: gpio.35                 # LIKELY e-stop (verify!)
  
  # Macro buttons (if present on control panel)
  # Firmware strings show macro support
  macro0_pin: NO_PIN                 # Configure if panel has macro buttons
  macro1_pin: NO_PIN                 # Can be used for preset operations
  macro2_pin: NO_PIN                 # (e.g., "Home", "Frame", "Test Fire")
  macro3_pin: NO_PIN
  
  # Fault pin (for external fault detection)
  fault_pin: NO_PIN                  # Not typically used on lasers

# Probe configuration
# For work surface probing or tool length measurement
probe:
  pin: gpio.15                       # LIKELY probe pin (61 refs, bidirectional)
  toolsetter_pin: NO_PIN             # Not used on laser
  check_mode_start: false            # Don't require probe for starting
  hard_stop: false                   # Soft probe detection

# Coolant outputs (can be repurposed for laser accessories)
# These can drive air assist, extraction fan, etc.
coolant:
  flood_pin: NO_PIN                  # Could repurpose for air assist solenoid
  mist_pin: NO_PIN                   # Could repurpose for extraction fan control
  delay_ms: 0                        # No delay needed

# User-defined outputs (for custom modifications)
# Can add status LEDs, auxiliary fans, air assist, etc.
user_outputs:
  analog0_pin: NO_PIN                # Could add: Status LED (PWM for brightness)
  analog1_pin: NO_PIN                # Could add: Speed indicator LED
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000                   # PWM frequency for analog outputs
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN               # Could add: Air assist enable
  digital1_pin: NO_PIN               # Could add: Extraction fan enable
  digital2_pin: NO_PIN               # Could add: Work light
  digital3_pin: NO_PIN               # Could add: Alarm indicator
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

# User-defined inputs (for custom sensors)
user_inputs:
  analog0_pin: NO_PIN                # Could add: Temperature sensor
  analog1_pin: NO_PIN                # Could add: Power meter
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  digital0_pin: NO_PIN               # Could add: Material detect sensor
  digital1_pin: NO_PIN               # Could add: Smoke detector
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

# Start-up behavior
start:
  must_home: false                   # Don't require homing to start (but recommended!)
  deactivate_parking: true           # Parking not used on laser
  check_limits: true                 # Check limit switch states on startup

# Parking (not used on 2-axis laser)
parking:
  enable: false                      # Parking disabled
  axis: Z
  target_mpos_mm: 0.000
  rate_mm_per_min: 800.000
  pullout_distance_mm: 5.000
  pullout_rate_mm_per_min: 250.000

# Macros - Can define startup sequences and custom operations
macros:
  startup_line0: ""                  # Run after boot (e.g., homing)
  startup_line1: ""                  # Second startup command
  macro0: ""                         # User macro 0 (e.g., "$H" for homing)
  macro1: ""                         # User macro 1 (e.g., frame outline)
  macro2: ""                         # User macro 2 (e.g., test fire)
  macro3: ""                         # User macro 3 (e.g., focus assist)
  after_homing: ""                   # Run after successful homing
  after_reset: ""                    # Run after reset
  after_unlock: ""                   # Run after unlock from alarm

# SD Card (optional - if you add one)
sdcard:
  cs_pin: NO_PIN                     # SD card chip select
  card_detect_pin: NO_PIN            # Card detection switch
  frequency_hz: 8000000              # SPI frequency

# SPI (for SD card or other peripherals)
spi:
  miso_pin: NO_PIN                   # SPI MISO
  mosi_pin: NO_PIN                   # SPI MOSI
  sck_pin: NO_PIN                    # SPI clock

# UART channels (for debugging or external displays)
# UART0 is used for USB connection
uart_channel1:
  uart_num: 1                        # Secondary UART
  txd_pin: NO_PIN                    # Could add external display/controller
  rxd_pin: NO_PIN
  rts_pin: NO_PIN
  baud: 115200
  mode: 8N1

# Kinematics (Cartesian for XY laser)
kinematics:
  Cartesian:

# Start message shown on boot
start_message: "Genmitsu Kiosk 2.5W - FluidNC v3.9.9 Ready"

# ============================================================================
# HARDWARE VERIFICATION STATUS
# ============================================================================
# 
# ✓ VERIFIED FROM HARDWARE ($$ command output):
#   - All motion parameters ($0-$32, $100-$135)
#   - Homing configuration (enabled, speeds, direction)
#   - Work area (100mm x 100mm)
#   - Laser mode enabled
# 
# ✓ VERIFIED FROM BINARY ANALYSIS:
#   - I2S pins: GPIO 25, 26, 27 (30+, 34, 27 references)
#   - Laser PWM: GPIO 16 (136 references, 5kHz frequency confirmed)
# 
# ⚠ LIKELY (high confidence from binary analysis):
#   - Limit switches: GPIO 13 (X), GPIO 14 (Y) - 77 & 82 refs
#     These are common limit pins in Grbl_ESP32 I2S configurations
#   
# ⚠ LIKELY (medium confidence from pin capabilities + refs):
#   - Safety door: GPIO 34 (39 refs, input-only, safe for critical function)
#   - Feed hold: GPIO 36 (32 refs, input-only)
#   - Cycle start: GPIO 39 (22 refs, input-only)
#   - E-stop: GPIO 35 (24 refs, input-only)
#   - Probe: GPIO 15 (61 refs, bidirectional)
# 
# ============================================================================
# VERIFICATION PROCEDURE
# ============================================================================
# 
# BEFORE OPERATING:
# 1. Flash this config to FluidNC
# 2. Connect via serial (115200 baud) or WebUI
# 3. Type: $Pins/Report
# 4. Test each switch/button and verify GPIO state changes
# 5. Update pins as needed
# 6. Re-upload config: $LocalFS/Upload
# 
# CRITICAL SAFETY TEST:
# 1. Set laser to low power: S100 (10%)
# 2. Start a test pattern: M3 S100
# 3. IMMEDIATELY open safety door/lid
# 4. VERIFY laser stops within 100ms
# 5. If laser doesn't stop, DO NOT USE until correct pin is found!
# 
# LIMIT SWITCH TEST:
# 1. Manually trigger each limit switch
# 2. Verify alarm triggers: "ALARM:1 Hard limit"
# 3. Verify correct axis is identified in status
# 4. If wrong axis, swap GPIO 13 and 14 in config
# 
# CONTROL BUTTON TEST:
# 1. Start a motion command
# 2. Press feed hold - should pause
# 3. Press cycle start - should resume
# 4. Verify buttons work as expected
# 5. Update pins if needed
# 
# ============================================================================
# PIN UPDATE PROCEDURE
# ============================================================================
# 
# If pins are incorrect after testing:
# 
# 1. Edit this file locally
# 2. Change gpio.XX values to correct pins
# 3. Save file as "config.yaml"
# 4. Upload via WebUI:
#    - Go to http://[ESP32_IP]/
#    - Config → Upload
#    - Select config.yaml
#    - Click Upload
# 
# OR via serial:
#    - $LocalFS/Upload
#    - Paste file contents
#    - Send Ctrl+D to finish
# 
# 5. Restart: $Bye
# 6. Verify: $Pins/Report
# 
# ============================================================================
# SAFETY NOTES
# ============================================================================
# 
# - Safety door pin is CRITICAL - verify before laser operation!
# - Limit switches prevent mechanical crashes - test thoroughly!
# - E-stop should immediately kill all motion and laser
# - Always test at low power (S100) before full power
# - Keep fire extinguisher nearby during laser operation
# - Never leave laser unattended while operating
# - Ensure adequate ventilation for laser fumes
# 
# ============================================================================
