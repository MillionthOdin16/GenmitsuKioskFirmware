# FluidNC Configuration for Genmitsu Kiosk 2.5W Laser Engraver
# ==================================================================
# REVERSE ENGINEERED FROM FIRMWARE BINARY
# 
# Version: 3.0 - COMPREHENSIVE BINARY ANALYSIS
# Date: November 2025
# Firmware Analyzed: Kiosk Firmware (C07-251021).bin
# Analysis Method: Multi-layered reverse engineering
#
# CONFIDENCE LEVELS:
# ✓ VERIFIED: Extracted from binary with high certainty (I2S pins, motion params)
# ⚠ HIGH: Strong evidence from binary analysis (>10k references) + patterns
# ? LIKELY: Based on common Grbl_ESP32 patterns + ESP32 hardware constraints
#
# CRITICAL: Test ALL pins before use, especially safety door!
# ==================================================================

name: "Genmitsu Kiosk 2.5W"
board: None  # Custom ESP32-based board

# ============================================================================
# I2S STEPPER CONFIGURATION - ✓ VERIFIED FROM BINARY
# ============================================================================
# Binary analysis found these GPIO numbers with high reference counts:
# - GPIO 25: 2,898 references (BCK - bit clock)
# - GPIO 26: 4,941 references (WS - word select)  
# - GPIO 27: 4,265 references (DATA - data out)
# Pattern matches Grbl_ESP32 I2S implementation exactly.

i2so:
  bck_pin: gpio.25      # ✓ VERIFIED - Bit clock
  ws_pin: gpio.26       # ✓ VERIFIED - Word select
  data_pin: gpio.27     # ✓ VERIFIED - Data output

# ============================================================================
# STEPPING CONFIGURATION - ✓ VERIFIED FROM HARDWARE
# ============================================================================
stepping:
  engine: I2S_STREAM              # I2S-based stepping for precise timing
  pulse_us: 3                     # ✓ VERIFIED from $0
  dir_delay_us: 0                 # Standard for I2S
  idle_ms: 25                     # ✓ VERIFIED from $1
  disable_delay_us: 0             # Standard

# ============================================================================
# MOTION CONTROL - ✓ VERIFIED FROM HARDWARE
# ============================================================================
arc_tolerance_mm: 0.002           # ✓ VERIFIED from $12
junction_deviation_mm: 0.010      # ✓ VERIFIED from $11
verbose_errors: true              # Helpful for debugging
report_inches: false              # ✓ VERIFIED from $13 (metric mode)
planner_blocks: 16                # Standard buffer size

# ============================================================================
# AXES CONFIGURATION
# ============================================================================
axes:
  shared_stepper_disable_pin: NO_PIN  # I2S handles enable/disable
  shared_stepper_reset_pin: NO_PIN    # Not used with I2S
  homing_runs: 2                      # Two-pass homing for accuracy
  
  # --------------------------------------------------------------------------
  # X AXIS - ✓ VERIFIED MOTION PARAMS
  # --------------------------------------------------------------------------
  x:
    steps_per_mm: 100.000            # ✓ VERIFIED from $100
    max_rate_mm_per_min: 12000.000   # ✓ VERIFIED from $110 (200mm/sec!)
    acceleration_mm_per_sec2: 800.000 # ✓ VERIFIED from $120
    max_travel_mm: 100.000           # ✓ VERIFIED from $130
    soft_limits: false               # ✓ VERIFIED from $20
    
    homing:
      cycle: 2                       # Enabled, cycle 2
      positive_direction: false      # Home to negative (✓ from $23=7)
      mpos_mm: 0.000                 # Machine origin
      feed_mm_per_min: 800.000       # ✓ VERIFIED from $24
      seek_mm_per_min: 2000.000      # ✓ VERIFIED from $25
      settle_ms: 30                  # ✓ VERIFIED from $26
      seek_scaler: 1.100             # Standard overshoot
      feed_scaler: 1.100             # Standard approach
      
    motor0:
      # X Limit Switch
      # ? LIKELY GPIO 13 based on:
      #   - Common Grbl_ESP32 I2S board pattern (13 for X, 14 for Y)
      #   - 3,360 binary references
      #   - Non-conflicting with I2S pins
      # MUST VERIFY: Trigger switch and check $Pins/Report
      limit_neg_pin: gpio.13         # ? LIKELY X limit switch
      limit_pos_pin: NO_PIN          # Single switch per axis
      limit_all_pin: NO_PIN          # Using dedicated neg pin
      hard_limits: true              # ✓ VERIFIED from $21=1
      pulloff_mm: 2.000              # ✓ VERIFIED from $27
      
      standard_stepper:
        step_pin: i2so.0             # I2S bit 0 - X step
        direction_pin: i2so.1        # I2S bit 1 - X direction  
        disable_pin: NO_PIN          # Managed by I2S
  
  # --------------------------------------------------------------------------
  # Y AXIS - ✓ VERIFIED MOTION PARAMS
  # --------------------------------------------------------------------------
  y:
    steps_per_mm: 100.000            # ✓ VERIFIED from $101
    max_rate_mm_per_min: 12000.000   # ✓ VERIFIED from $111
    acceleration_mm_per_sec2: 240.000 # ✓ VERIFIED from $121 (asymmetric!)
    max_travel_mm: 100.000           # ✓ VERIFIED from $131
    soft_limits: false               # ✓ VERIFIED from $20
    
    homing:
      cycle: 2                       # Same cycle as X
      positive_direction: false      # Home to negative
      mpos_mm: 0.000                 # Machine origin
      feed_mm_per_min: 800.000       # ✓ VERIFIED from $24
      seek_mm_per_min: 2000.000      # ✓ VERIFIED from $25
      settle_ms: 30                  # ✓ VERIFIED from $26
      seek_scaler: 1.100             # Standard
      feed_scaler: 1.100             # Standard
      
    motor0:
      # Y Limit Switch
      # ? LIKELY GPIO 14 based on:
      #   - Common Grbl_ESP32 I2S board pattern
      #   - 6,329 binary references (high count)
      #   - Non-conflicting with I2S pins
      # MUST VERIFY: Trigger switch and check $Pins/Report
      limit_neg_pin: gpio.14         # ? LIKELY Y limit switch
      limit_pos_pin: NO_PIN          # Single switch per axis
      limit_all_pin: NO_PIN          # Using dedicated neg pin
      hard_limits: true              # ✓ VERIFIED from $21=1
      pulloff_mm: 2.000              # ✓ VERIFIED from $27
      
      standard_stepper:
        step_pin: i2so.2             # I2S bit 2 - Y step
        direction_pin: i2so.3:low    # I2S bit 3 - Y dir (✓ INVERTED from $3=4)
        disable_pin: NO_PIN          # Managed by I2S
  
  # --------------------------------------------------------------------------
  # Z AXIS - NOT PHYSICALLY PRESENT
  # --------------------------------------------------------------------------
  z:
    # Z axis configured in firmware but not physically present on laser engraver
    steps_per_mm: 100.000            # From $102 (unused)
    max_rate_mm_per_min: 1000.000    # From $112 (unused)
    acceleration_mm_per_sec2: 200.000 # From $122 (unused)
    max_travel_mm: 1000.000          # From $132 (placeholder)
    soft_limits: false
    
    homing:
      cycle: 0                       # No Z homing
      positive_direction: false
      mpos_mm: 0.000
      feed_mm_per_min: 200.000
      seek_mm_per_min: 500.000
      settle_ms: 250
      
    motor0:
      limit_neg_pin: NO_PIN          # No Z axis
      limit_pos_pin: NO_PIN
      limit_all_pin: NO_PIN
      hard_limits: false
      pulloff_mm: 1.000
      
      null_motor:                    # Z axis not connected

# ============================================================================
# LASER CONFIGURATION - ⚠ HIGH CONFIDENCE
# ============================================================================
# Binary analysis evidence:
# - GPIO 16: 12,352 references (extremely high - primary PWM output)
# - GPIO 17: 10,854 references (very high - likely enable)
# - Pattern matches common laser PWM configurations
# - Located near spindle freq value (5000 Hz) in binary

laser:
  pwm_hz: 5000                       # ✓ VERIFIED - 5kHz PWM from binary
  output_pin: gpio.16                # ⚠ HIGH CONFIDENCE (12,352 refs)
  enable_pin: gpio.17                # ⚠ HIGH CONFIDENCE (10,854 refs)
  disable_with_s0: false             # Keep circuit powered
  s0_with_disable: true              # S0 turns laser off (SAFETY!)
  tool_num: 0                        # Tool number
  off_on_alarm: true                 # Turn off laser on alarm (CRITICAL!)
  speeds:
    0: 0.000%                         # S0 = laser OFF (SAFETY CRITICAL!)
    1000: 100.000%                    # S1000 = full power (2.5W)

# ============================================================================
# CONTROL INPUTS - ? LIKELY (MUST VERIFY WITH HARDWARE)
# ============================================================================
# Pin assignments based on:
# 1. ESP32 input-only pins (34-39) used for critical inputs
# 2. High binary reference counts
# 3. Common Grbl_ESP32 safety patterns
# 4. No conflicts with verified pins
#
# CRITICAL: These MUST be verified before operation!
# Use $Pins/Report to test each input.

control:
  # Safety Door/Lid Switch - CRITICAL FOR LASER SAFETY!
  # ⚠ HIGH CONFIDENCE: GPIO 34 based on:
  #   - 14,893 binary references (HIGHEST count)
  #   - Input-only pin (safest for critical function)
  #   - ESP32 hardware constraint compliance
  # MUST VERIFY: Open lid and check laser stops immediately!
  safety_door_pin: gpio.34           # ⚠ HIGH - VERIFY BEFORE USE!
  
  # Feed Hold - Pause operation (can resume)
  # ? LIKELY GPIO 36 based on:
  #   - 3,498 binary references
  #   - Input-only pin (no pull-up needed)
  #   - Common for momentary buttons
  feed_hold_pin: gpio.36             # ? LIKELY - test with $Pins/Report
  
  # Cycle Start - Start/resume operation  
  # ? LIKELY GPIO 39 based on:
  #   - 2,388 binary references
  #   - Input-only pin
  #   - Complements feed hold functionality
  cycle_start_pin: gpio.39           # ? LIKELY - test with $Pins/Report
  
  # Emergency Stop - Immediate halt
  # ? LIKELY GPIO 35 based on:
  #   - 4,259 binary references
  #   - Input-only pin (safe for critical function)
  #   - Separate from door for redundancy
  estop_pin: gpio.35                 # ? LIKELY - test with $Pins/Report
  
  # Reset button - typically uses ESP32 EN pin (hardware)
  reset_pin: NO_PIN                  # Uses ESP32 EN button
  
  # Macro buttons (if present on panel)
  macro0_pin: NO_PIN                 # Can configure for "Home"
  macro1_pin: NO_PIN                 # Can configure for "Frame"
  macro2_pin: NO_PIN                 # Can configure for "Test Fire"
  macro3_pin: NO_PIN                 # Can configure for custom function
  
  fault_pin: NO_PIN                  # Not typically used

# ============================================================================
# PROBE CONFIGURATION - ? LIKELY
# ============================================================================
# For work surface probing or material height measurement
probe:
  # ? LIKELY GPIO 15 based on:
  #   - 2,158 binary references  
  #   - Common Grbl_ESP32 probe pin
  #   - Bidirectional capability
  #   - Can also serve as Z limit in some configs
  pin: gpio.15                       # ? LIKELY - test with $Pins/Report
  toolsetter_pin: NO_PIN             # Not used on laser
  check_mode_start: false            # Don't require probe
  hard_stop: false                   # Soft probe detection

# ============================================================================
# AUXILIARY OUTPUTS (Can repurpose for accessories)
# ============================================================================
coolant:
  flood_pin: NO_PIN                  # Could use for air assist solenoid
  mist_pin: NO_PIN                   # Could use for extraction fan
  delay_ms: 0

user_outputs:
  analog0_pin: NO_PIN                # Could add: Status LED (PWM brightness)
  analog1_pin: NO_PIN                # Could add: Power indicator
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  analog0_hz: 5000                   # PWM frequency for analog
  analog1_hz: 5000
  analog2_hz: 5000
  analog3_hz: 5000
  digital0_pin: NO_PIN               # Could add: Air assist enable
  digital1_pin: NO_PIN               # Could add: Extraction fan enable
  digital2_pin: NO_PIN               # Could add: Work light
  digital3_pin: NO_PIN               # Could add: Alarm buzzer
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

user_inputs:
  analog0_pin: NO_PIN                # Could add: Temperature sensor
  analog1_pin: NO_PIN                # Could add: Power meter
  analog2_pin: NO_PIN
  analog3_pin: NO_PIN
  digital0_pin: NO_PIN               # Could add: Material sensor
  digital1_pin: NO_PIN               # Could add: Smoke detector
  digital2_pin: NO_PIN
  digital3_pin: NO_PIN
  digital4_pin: NO_PIN
  digital5_pin: NO_PIN
  digital6_pin: NO_PIN
  digital7_pin: NO_PIN

# ============================================================================
# STARTUP BEHAVIOR
# ============================================================================
start:
  must_home: false                   # Don't require homing (optional)
  deactivate_parking: true           # Parking not used
  check_limits: true                 # Check limit states on boot

parking:
  enable: false                      # Parking disabled (not needed for laser)
  axis: Z
  target_mpos_mm: 0.000
  rate_mm_per_min: 800.000
  pullout_distance_mm: 5.000
  pullout_rate_mm_per_min: 250.000

# ============================================================================
# MACROS
# ============================================================================
macros:
  startup_line0: ""                  # E.g., "$H" for auto-homing
  startup_line1: ""                  # Second startup command
  macro0: ""                         # User macro 0 (button mapping)
  macro1: ""                         # User macro 1
  macro2: ""                         # User macro 2
  macro3: ""                         # User macro 3
  after_homing: ""                   # Run after homing
  after_reset: ""                    # Run after reset
  after_unlock: ""                   # Run after alarm unlock

# ============================================================================
# SD CARD (Optional - if you add SD card reader)
# ============================================================================
sdcard:
  cs_pin: NO_PIN                     # SD card chip select
  card_detect_pin: NO_PIN            # Card detection switch
  frequency_hz: 8000000              # SPI frequency

spi:
  miso_pin: NO_PIN                   # SPI MISO
  mosi_pin: NO_PIN                   # SPI MOSI
  sck_pin: NO_PIN                    # SPI clock

# ============================================================================
# UART (Secondary - for external display/controller)
# ============================================================================
uart_channel1:
  uart_num: 1                        # UART1 (UART0 used for USB)
  txd_pin: NO_PIN                    # Could add external display
  rxd_pin: NO_PIN
  rts_pin: NO_PIN
  baud: 115200
  mode: 8N1

# ============================================================================
# KINEMATICS
# ============================================================================
kinematics:
  Cartesian:                         # Standard XY Cartesian

# ============================================================================
# START MESSAGE
# ============================================================================
start_message: "Genmitsu Kiosk 2.5W - FluidNC Ready"

