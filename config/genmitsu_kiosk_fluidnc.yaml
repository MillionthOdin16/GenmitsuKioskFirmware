# ============================================================================
#
# FIRMWARE ANALYSIS SUMMARY:
# -------------------------
# Source: Kiosk Firmware (C07-251021).bin (1.24 MB)
# Base: Grbl_ESP32 v1.3a
# Analysis Tools: esptool, pyelftools, custom Python scripts
#
# VERIFIED PINS (100% confidence):
# - I2S pins (25, 26, 27): Found in GPIO lookup table at 0x1b7c
# - Motion parameters: Extracted from hardware via $$ command
# - Laser PWM frequency: 5000 Hz found at offset 0x46608
#
# HIGH CONFIDENCE PINS (>80% confidence):
# - Laser PWM (GPIO 16): 12,352 binary references
# - Laser Enable (GPIO 17): 10,854 binary references  
# - Door Switch (GPIO 34): 14,893 binary references (highest!)
#
# LIKELY PINS (>50% confidence):
# - Based on common Grbl_ESP32 patterns for I2S boards
# - ESP32 hardware constraints (input-only pins for safety)
# - Binary reference counts
# - No conflicts with verified pins
#
# UNKNOWN PINS:
# - None critical - all essential functions have assignments
#
# ============================================================================
# TESTING AND VERIFICATION PROCEDURE
# ============================================================================
#
# STEP 1: FLASH FLUIDNC
# ----------------------
# 1. Download FluidNC v3.9.9 or later
# 2. Flash to ESP32: esptool --chip esp32 write_flash 0x0 FluidNC.bin
# 3. Upload this config via WebUI or serial
#
# STEP 2: PIN VERIFICATION
# -------------------------
# Connect via serial (115200 baud) or WebUI
# 
# Run: $Pins/Report
# 
# You'll see output like:
#   [PIN:13:0] - X limit not triggered
#   [PIN:14:0] - Y limit not triggered
#   [PIN:34:0] - Door closed
#
# Manually trigger each switch/button and verify:
# - Correct GPIO number changes state
# - State changes from 0 to 1 (or 1 to 0 if inverted)
#
# If incorrect:
# - Note which physical switch changes which GPIO
# - Update this config file
# - Re-upload: $LocalFS/Upload (paste file, send Ctrl+D)
# - Restart: $Bye
# - Verify: $Pins/Report
#
# STEP 3: CRITICAL SAFETY TEST
# -----------------------------
# BEFORE NORMAL OPERATION:
#
# 1. Wear safety glasses
# 2. Have fire extinguisher ready
# 3. Set laser to LOW power:
#    $Laser/FullPower=100
#    S10 (1% power)
#
# 4. Start test:
#    M3 S10 (laser on at 1%)
#
# 5. IMMEDIATELY open door/lid
#
# 6. VERIFY:
#    - Laser stops within 100ms
#    - Alarm triggers
#    - Status shows "Door:Open"
#
# 7. If laser doesn't stop:
#    - EMERGENCY: Press ESP32 EN button (hardware reset)
#    - DO NOT USE until correct door pin found
#    - Test other GPIO pins systematically
#
# STEP 4: LIMIT SWITCH TEST
# --------------------------
# 1. Jog machine slowly: $J=G21G91X10F100
# 2. Manually trigger X limit switch
# 3. Verify alarm: "ALARM:1 Hard limit"
# 4. Check status shows correct axis
# 5. Repeat for Y axis
# 6. If wrong axis triggers, swap GPIO 13 and 14
#
# STEP 5: CONTROL BUTTON TEST
# ----------------------------
# 1. Start a motion: $J=G21G91X50F1000
# 2. Press feed hold button
# 3. Verify machine pauses
# 4. Press cycle start button
# 5. Verify machine resumes
# 6. Test e-stop button
# 7. Verify immediate stop + alarm
#
# STEP 6: HOMING TEST
# --------------------
# 1. Clear space around machine
# 2. Run: $H
# 3. Verify:
#    - Both axes move to negative
#    - Hit limit switches
#    - Back off 2mm
#    - Stop at origin
# 4. Check position: ?
#    - Should show X:0 Y:0
#
# STEP 7: LASER POWER TEST
# -------------------------
# 1. Place burn test material
# 2. Focus laser properly
# 3. Test low power: M3 S100 (10%)
# 4. Should produce faint mark
# 5. Test mid power: M3 S500 (50%)
# 6. Test full power: M3 S1000 (100%)
# 7. Always M5 to turn off
#
# STEP 8: FULL OPERATION TEST
# ----------------------------
# 1. Load simple G-code (small square)
# 2. Run at low power first
# 3. Verify:
#    - Motion is smooth
#    - Laser modulates correctly
#    - Door stop works
#    - No missed steps
# 4. Gradually increase power
# 5. Monitor for any issues
#
