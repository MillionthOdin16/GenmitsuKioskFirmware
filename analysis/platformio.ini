# PlatformIO Configuration for Genmitsu Kiosk
# Place this in the root of your Grbl_Esp32 directory

[platformio]
default_envs = genmitsu_kiosk
src_dir = Grbl_Esp32

[env]
platform = espressif32@^6.0.0
framework = arduino
monitor_speed = 115200
upload_speed = 921600

[env:genmitsu_kiosk]
board = esp32dev
build_flags =
    -DMACHINE_GENMITSU_KIOSK
    -DENABLE_WIFI
    -DENABLE_BLUETOOTH=0
    -DENABLE_NOTIFICATIONS
    -DENABLE_SD_CARD=0
    
# Partition scheme for 4MB flash
board_build.partitions = min_spiffs.csv

# Flash configuration (matches original firmware)
board_build.flash_mode = dio
board_build.f_flash = 80000000L
board_build.flash_size = 4MB

# Optimization
build_type = release
build_unflags = -Os
build_flags = -O2

# Serial monitor configuration
monitor_filters = 
    esp32_exception_decoder
    time
monitor_rts = 0
monitor_dtr = 0
